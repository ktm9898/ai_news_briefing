name: 📰 뉴스 수집 파이프라인

on:
  schedule:
    # 매일 오전 7시 KST (UTC 22:00 전날)
    - cron: '0 22 * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 패키지 설치
        run: pip install -r requirements.txt

      - name: 🧹 서비스 계정 Drive 정리 (오래된 브리핑 문서 삭제)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          echo "$GOOGLE_CREDENTIALS_JSON" > service_account.json
          python -u run_pipeline.py --cleanup

      - name: 🚀 뉴스 수집 및 브리핑 문서 생성 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
        run: |
          echo "Starting news collection pipeline..."
          python -u run_pipeline.py

      - name: 🧹 오래된 오디오 파일 정리 (10일 보존 정책)
        run: |
          echo "Cleaning up audio files older than 10 days..."
          find audio/ -name "*.mp3" -type f -mtime +10 -not -name "briefing_latest.mp3" -delete
          ls -R audio/

      - name: 📤 오디오 파일 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/ -f
          git diff --cached --quiet || {
            git commit -m "🔊 브리핑 오디오 자동 업데이트 $(date +%Y-%m-%d)"
            git pull --rebase origin master
            git push origin master
          }
